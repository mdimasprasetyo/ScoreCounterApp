name: Android build

on:
  push:
    branches: [ "master", "v1.1-improvements" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  # Manual only (Actions → Android build → Run workflow): publishes the debug APK as a
  # throwaway pre-release so it can be downloaded without signing in to GitHub.
  preview-release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-debug
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: preview-${{ github.run_number }}
          name: Preview build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: app-debug.apk
